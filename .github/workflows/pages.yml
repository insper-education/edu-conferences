name: Publicar GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Atualizar catálogo com Azure OpenAI
        if: github.event_name != 'push'
        env:
          GPT6_AZURE_ENDPOINT: ${{ secrets.GPT6_AZURE_ENDPOINT }}
          GPT6_DEPLOYMENT_NAME: ${{ secrets.GPT6_DEPLOYMENT_NAME }}
          GPT6_API_VERSION: ${{ secrets.GPT6_API_VERSION }}
          GPT6_API_KEY: ${{ secrets.GPT6_API_KEY }}
        run: npm run update-conferences -- --write
      - name: Verificar alterações no catálogo
        id: catalog-diff
        run: |
          if git diff --quiet -- data/conferences.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Salvar catálogo atualizado
        if: steps.catalog-diff.outputs.changed == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/conferences.json
          git commit -m "Atualiza prazos das conferências"
          git push
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
